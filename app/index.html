<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de Vulnerabilidades HTTP</title>
  <!-- React and ReactDOM from CDN (no build tools) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #root {
      width: 90%;
      max-width: 800px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .section {
      margin-top: 1.5rem;
    }
    label {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    input, textarea, select {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      border-radius: 6px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 1rem;
    }
    button {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background: #ff6b6b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    button:hover {
      background: #ff5252;
      transform: translateY(-2px);
    }
    pre {
      background: rgba(0,0,0,0.4);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin-top: 1rem;
    }
    /* Email mockup styling */
    .email-mockup {
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 1rem;
      color: #fff;
    }
    .email-header {
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .email-body {
      margin: 1rem 0;
      line-height: 1.5;
    }
    .cta-button {
      display: inline-block;
      background: #4caf50;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      text-decoration: none;
      margin-top: 0.5rem;
    }
    .email-footer {
      font-size: 0.8rem;
      opacity: 0.7;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 0.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/javascript" src="app.js"></script>
</body>
</html>
